<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dashboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23232136'/%3E%3Ctext x='2' y='23' font-family='monospace' font-size='17' font-weight='bold' fill='%23ebbcba'%3E%3E_%3C/text%3E%3C/svg%3E">
  <style>
    /* Rosé Pine Moon */
    :root {
      --base:    #232136;
      --surface: #2a273f;
      --overlay: #393552;
      --muted:   #6e6a86;
      --subtle:  #908caa;
      --text:    #e0def4;
      --love:    #eb6f92;
      --gold:    #f6c177;
      --rose:    #ebbcba;
      --pine:    #3e8fb0;
      --foam:    #9ccfd8;
      --iris:    #c4a7e7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--base);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
      padding: 1.5rem;
    }

    /* ── Header ── */
    #header {
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--overlay);
    }

    #header-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.5rem;
    }

    #clock {
      font-size: 2.2rem;
      color: var(--rose);
      letter-spacing: -0.02em;
    }

    #date-line { color: var(--muted); font-size: 0.85rem; }

    #weather-header {
      text-align: center;
      flex: 1;
      padding: 0 1rem;
    }

    #weather-header .wh-temp { color: var(--foam); font-size: 1.25rem; letter-spacing: -0.01em; display: block; }
    #weather-header .wh-cond { color: var(--muted); font-size: 0.72rem; display: block; margin-top: 0.1rem; }

    #header-quote {
      color: var(--iris);
      font-style: italic;
      font-size: 0.75rem;
      line-height: 1.7;
      padding-left: 0.65rem;
      border-left: 2px solid var(--iris);
      opacity: 0.85;
    }

    #header-quote .quote-attr { color: var(--muted); font-style: normal; }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 1rem;
    }

    .col { display: flex; flex-direction: column; gap: 1rem; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--overlay);
      border-radius: 4px;
      padding: 1rem;
    }

    .card-title {
      color: var(--pine);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .card-title::before { content: '▸'; color: var(--iris); }

    /* ── Links ── */
    a { color: var(--foam); text-decoration: none; }
    a:hover { color: var(--rose); text-decoration: underline; }

    /* ── States ── */
    .loading { color: var(--muted); }
    .error   { color: var(--love); font-size: 0.8rem; }

    /* ── News ── */
    .news-list { list-style: none; }

    .news-list li {
      padding: 0.3rem 0;
      border-bottom: 1px solid var(--overlay);
      display: flex;
      gap: 0.5rem;
    }

    .news-list li:last-child { border-bottom: none; }
    .news-rank { color: var(--muted); min-width: 1.5rem; text-align: right; flex-shrink: 0; }

    .news-meta {
      color: var(--gold);
      font-size: 0.72rem;
      white-space: nowrap;
    }

    .news-title {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Stats ── */
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 0.18rem 0;
    }

    .stat-label { color: var(--muted); }
    .stat-value { color: var(--foam); }

    /* ── Progress ── */
    .progress-bar {
      background: var(--overlay);
      border-radius: 2px;
      height: 5px;
      margin: 0.25rem 0 0.5rem;
      overflow: hidden;
    }

    .progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
    .fill-rose { background: var(--rose); }
    .fill-pine { background: var(--pine); }
    .fill-foam { background: var(--foam); }
    .fill-iris { background: var(--iris); }

    .progress-label {
      display: flex;
      justify-content: space-between;
      color: var(--subtle);
      font-size: 0.72rem;
    }

    /* ── Sports ── */
    .match {
      padding: 0.3rem 0;
      border-bottom: 1px solid var(--overlay);
    }

    .match:last-child { border-bottom: none; }

    .match-teams {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .match-team { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .match-team:last-child { text-align: right; }

    .match-score {
      background: var(--overlay);
      padding: 0.1rem 0.45rem;
      border-radius: 2px;
      color: var(--gold);
      font-weight: bold;
      flex-shrink: 0;
    }

    .match-meta { color: var(--muted); font-size: 0.72rem; margin-top: 0.1rem; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 0.4rem; margin-bottom: 0.75rem; }

    .tab-btn {
      background: none;
      border: 1px solid var(--overlay);
      color: var(--muted);
      font-family: inherit;
      font-size: 0.68rem;
      padding: 0.15rem 0.5rem;
      border-radius: 2px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .tab-btn.active { border-color: var(--pine); color: var(--pine); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Rank controls ── */
    .rank-controls { display: flex; gap: 0.3rem; margin-bottom: 0.6rem; }

    .rank-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.65rem;
      padding: 0.1rem 0.4rem;
      border-radius: 2px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .rank-btn:hover { color: var(--subtle); }
    .rank-btn.active { border-color: var(--rose); color: var(--rose); }

    /* ── Mode toggle ── */
    .mode-btn {
      background: none;
      border: 1px solid var(--overlay);
      color: var(--muted);
      font-family: inherit;
      font-size: 0.68rem;
      padding: 0.15rem 0.5rem;
      border-radius: 2px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .mode-btn:hover { color: var(--subtle); }
    .mode-btn.active { border-color: var(--pine); color: var(--pine); }

    /* ── Ticker bar ── */
    #ticker-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--overlay);
      padding-bottom: 0.4rem;
    }

    .ticker-item {
      display: inline-flex;
      align-items: baseline;
      gap: 0.28rem;
      padding: 0.1rem 0.8rem;
      border-right: 1px solid var(--overlay);
      text-decoration: none;
      white-space: nowrap;
      font-size: 0.72rem;
    }

    .ticker-item:first-child { padding-left: 0; }
    .ticker-item:last-child  { border-right: none; }
    .ticker-item:hover .t-label { color: var(--rose); }
    .t-label  { color: var(--subtle); font-size: 0.65rem; letter-spacing: 0.07em; transition: color 0.12s; }
    .t-price  { color: var(--text); }
    .t-up     { color: var(--foam); }
    .t-dn     { color: var(--love); }

    /* ── Scrollable ── */
    .scrollable {
      max-height: 260px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--overlay) transparent;
    }

    /* ── Strava header ── */
    #strava-header { text-align: right; line-height: 1.45; }
    .sh-row { display: flex; justify-content: flex-end; align-items: baseline; gap: 0.35rem; }
    .sh-label { color: var(--muted); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .sh-val   { color: var(--foam); font-size: 0.82rem; }

    /* ── News card fill ── */
    .card-fill {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 220px);
      min-height: 300px;
    }

    .news-group {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .news-panels {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    .news-panels::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3rem;
      background: linear-gradient(transparent, var(--surface));
      pointer-events: none;
      transition: opacity 0.15s;
    }

    .news-panels.at-bottom::after { opacity: 0; }

    .card-fill .tab-panel.active {
      height: 100%;
      overflow-y: auto;
      max-height: none;
      scrollbar-width: thin;
      scrollbar-color: var(--overlay) transparent;
    }

    @media (max-width: 780px) {
      .grid { grid-template-columns: 1fr; }
      .card-fill { height: auto; max-height: 70vh; }
    }
  </style>
</head>

      <div id="news-dev" class="news-group">
        <div class="tabs" style="margin-bottom:0.5rem">

          <button class="tab-btn" data-tab="infoq"           onclick="switchTab(this,'infoq')">InfoQ</button>
        </div>
        <div class="news-panels" id="dev-panels">
          <div class="tab-panel active" id="tab-top"><span class="loading">loading sources...</span></div>
          <div class="tab-panel" id="tab-hn"><span class="loading">fetching...</span></div>
          <div class="tab-panel" id="tab-lobsters"><span class="loading">fetching...</span></div>
          <div class="tab-panel" id="tab-devto"><span class="loading">fetching...</span></div>
          <div class="tab-panel" id="tab-reddit"><span class="loading">fetching...</span></div>
          <div class="tab-panel" id="tab-ghtrend"><span class="loading">fetching...</span></div>
          <div class="tab-panel" id="tab-tns"><span class="loading">fetching...</span></div>
          <div class="tab-panel" id="tab-infoq"><span class="loading">fetching...</span></div>
        </div>
      </div>
      <!-- biz group -->
      <div id="news-biz" class="news-group" style="display:none">
        <div class="tabs" style="margin-bottom:0.5rem">
          <button class="tab-btn active" data-tab="topbiz"   onclick="switchTab(this,'topbiz')">Top</button>

        </div>
      </div>
    </div>

  </div>

</div>

function updateClock() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('date-line').textContent =
    `${DAYS[now.getDay()]}, ${MONTHS[now.getMonth()]} ${now.getDate()} ${now.getFullYear()}`;

}

// ── NEWS STORE + RANKING ──────────────────────────────────────────────────────
// Normalized item: { title, url, score, publishedAt (ms), meta, discuss? }
const NEWS_STORE  = {};
let   NEWS_FILTER = 'hot';

// HN gravity formula — widely used for time-decayed ranking
function hnRank(score, ageHours) { return score / Math.pow(ageHours + 2, 1.8); }

function rankItems(items) {
  const now = Date.now();
  const age = a => (now - a.publishedAt) / 3600000;
  switch (NEWS_FILTER) {
    case 'hot':   return [...items].sort((a, b) => hnRank(b.score, age(b)) - hnRank(a.score, age(a)));
    case 'today': return items.filter(i => now - i.publishedAt < 86400000)    .sort((a, b) => b.score - a.score);
    case 'week':  return items.filter(i => now - i.publishedAt < 7*86400000)  .sort((a, b) => b.score - a.score);
    case 'month': return items.filter(i => now - i.publishedAt < 30*86400000) .sort((a, b) => b.score - a.score);
    case 'top':   return [...items].sort((a, b) => b.score - a.score);
    default:      return items;
  }
}

function renderNews(tabId) {
  const el = document.getElementById(`tab-${tabId}`);
  if (!el || !NEWS_STORE[tabId]) return;
  const ranked = rankItems(NEWS_STORE[tabId]).slice(0, 15);
  if (!ranked.length) { el.innerHTML = `<span class="loading">no results for this filter</span>`; return; }
  el.innerHTML = `<ul class="news-list">${ranked.map((s, i) => `
    <li>
      <span class="news-rank">${i+1}.</span>
      <div style="flex:1;min-width:0">
        <a class="news-title" href="${esc(s.url)}" target="_blank">${esc(s.title)}</a>
        <span class="news-meta">${s.meta}${s.discuss ? ` &middot; <a href="${esc(s.discuss)}" target="_blank" style="color:var(--muted)">discuss</a>` : ''}</span>
      </div>
    </li>`).join('')}</ul>`;
  if (el.classList.contains('active')) updatePanelFade(el);
}

function setFilter(f) {
  NEWS_FILTER = f;
  document.querySelectorAll('.rank-btn').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  const group    = document.getElementById(`news-${NEWS_MODE}`);
  const activeId = group?.querySelector('.tab-panel.active')?.id?.replace('tab-', '');
  if (activeId === 'top')    renderTopStories();
  else if (activeId === 'topbiz') renderTopBiz();
  else if (activeId) renderNews(activeId);
}

function switchMode(mode) {
  NEWS_MODE = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('news-dev').style.display = mode === 'dev' ? '' : 'none';
  document.getElementById('news-biz').style.display = mode === 'biz' ? '' : 'none';
}

function switchTab(btn, id) {
  const group = document.getElementById(`news-${NEWS_MODE}`);
  group.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  group.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  const panel = document.getElementById(`tab-${id}`);
  panel.classList.add('active');
  updatePanelFade(panel);
  if (id === 'top')    { renderTopStories(); return; }
  if (id === 'topbiz') { renderTopBiz();     return; }
  if (NEWS_STORE[id]) renderNews(id);
}

function updatePanelFade(panel) {
  const wrap = panel.closest('.news-panels');
  if (!wrap) return;
  const atBottom = panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 8;
  wrap.classList.toggle('at-bottom', atBottom);
}

// Capture scroll on news panels to update fade
document.addEventListener('scroll', e => {
  if (e.target?.classList?.contains('tab-panel')) updatePanelFade(e.target);
}, true);

async function loadGitHub() {
  const el = document.getElementById('github-content');
  const { username, token } = CFG.github;
  try {
    // gh-data.js (generated by refresh-gh.sh) provides profile + repos + contributions
    // without needing a web PAT — gh CLI handles auth and org SSO automatically.
    // API fallback is used only when gh-data.js is absent.
    const ghd = window.GH_DATA;

    let user, repoList;
    if (ghd?.profile && ghd?.repos) {
      user     = ghd.profile;
      repoList = ghd.repos;
    } else {
      const headers = token ? { Authorization: `bearer ${token}` } : {};
      const repoBase = token
        ? `https://api.github.com/user/repos?sort=pushed&direction=desc&per_page=100&visibility=all&affiliation=owner,collaborator,organization_member`
        : `https://api.github.com/users/${username}/repos?sort=pushed&direction=desc&per_page=100`;
      const [u, firstPage] = await Promise.all([
        fetch(`https://api.github.com/users/${username}`, { headers }).then(r => r.json()),
        fetch(`${repoBase}&page=1`, { headers }).then(r => r.json()),
      ]);
      user     = u;
      repoList = Array.isArray(firstPage) ? [...firstPage] : [];
      if (token && repoList.length === 100) {
        for (let pg = 2; pg <= 5; pg++) {
          const batch = await fetch(`${repoBase}&page=${pg}`, { headers }).then(r => r.json());
          if (!Array.isArray(batch) || !batch.length) break;
          repoList = repoList.concat(batch);
          if (batch.length < 100) break;
        }
      }
    }
    const recentRepos = repoList.slice(0, 10);

    // Contributions: prefer gh-data.js (generated by refresh-gh.sh via `gh` CLI — sees org SSO)
    // Falls back to GraphQL API with PAT
    const now     = new Date();
    const to      = now.toISOString();
    const curYear = now.getFullYear();
    const years   = Array.from({ length: 5 }, (_, i) => curYear - i);
    let commits7d = null, contribsYTD = null, yrData = [];
    // GitHub's displayed contribution total = public fields + restrictedContributionsCount.
    // The two sets are mutually exclusive: public fields cover repos the OAuth app can see;
    // restrictedContributionsCount covers SAML-restricted org repos it cannot.
    const sumC = d => d ? (
      (d.totalCommitContributions              ?? 0) +
      (d.totalIssueContributions               ?? 0) +
      (d.totalPullRequestContributions         ?? 0) +
      (d.totalPullRequestReviewContributions   ?? 0) +
      (d.restrictedContributionsCount          ?? 0)
    ) : 0;

    if (ghd) {
      const u = ghd?.data?.user;
      if (u?.w) commits7d = sumC(u.w);
      yrData = [...years].reverse().map(yr => ({ yr, count: sumC(u?.[`yr${yr}`]) }));
      contribsYTD = yrData.find(d => d.yr === curYear)?.count ?? null;
    } else if (token) {
      const from7d    = new Date(now.getTime() - 7 * 86400000).toISOString();
      const yrQueries = years.map(yr => {
        const f = `${yr}-01-01T00:00:00Z`;
        const t = yr === curYear ? to : `${yr + 1}-01-01T00:00:00Z`;
        return `yr${yr}: contributionsCollection(from: "${f}", to: "${t}") {
          totalCommitContributions totalIssueContributions
          totalPullRequestContributions totalPullRequestReviewContributions
          restrictedContributionsCount
        }`;
      }).join('\n');
      const gql = await fetch('https://api.github.com/graphql', {
        method: 'POST',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: `{
          user(login: "${username}") {
            w: contributionsCollection(from: "${from7d}", to: "${to}") {
              totalCommitContributions totalIssueContributions
              totalPullRequestContributions totalPullRequestReviewContributions
              restrictedContributionsCount
            }
            ${yrQueries}
          }
        }` }),
      }).then(r => r.json());
      const u = gql?.data?.user;
      if (u?.w) commits7d = sumC(u.w);
      yrData = [...years].reverse().map(yr => {
        const d = u?.[`yr${yr}`];
        return { yr, count: sumC(d) };
      });
      contribsYTD = yrData.find(d => d.yr === curYear)?.count ?? null;
    }

    const LANG_COLORS = {
      JavaScript:'#f6c177', TypeScript:'#9ccfd8', Python:'#c4a7e7',
      Go:'#3e8fb0', Rust:'#ebbcba', Java:'#f6c177', 'C++':'#eb6f92',
      C:'#908caa', Ruby:'#eb6f92', Shell:'#3e8fb0', Nix:'#9ccfd8',
      Kotlin:'#c4a7e7', Swift:'#ebbcba', Scala:'#eb6f92',
    };

    // Language metrics — prefer commit counts from gh-data.js lang_commits; fall back to repo count
    const rawLangCommits = ghd?.lang_commits ?? null;
    const usingCommits   = rawLangCommits && Object.keys(rawLangCommits).length > 0;
    const langCounts     = usingCommits ? rawLangCommits : {};
    if (!usingCommits) repoList.forEach(r => { if (r.language) langCounts[r.language] = (langCounts[r.language] ?? 0) + 1; });
    const totalWithLang = Object.values(langCounts).reduce((s, n) => s + n, 0);
    const topLangs = Object.entries(langCounts).sort((a, b) => b[1] - a[1]).slice(0, 4);
    const langBar = topLangs.map(([lang, count]) => {
      const pct  = totalWithLang ? (count / totalWithLang * 100).toFixed(1) : 0;
      const col  = LANG_COLORS[lang] ?? 'var(--muted)';
      const lbl  = usingCommits ? `${count}c · ${pct}%` : `${count}r · ${pct}%`;
      return `<div style="display:flex;align-items:center;gap:0.4rem;padding:0.12rem 0">
        <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${col};flex-shrink:0"></span>
        <span style="color:var(--subtle);font-size:0.72rem;flex:1">${esc(lang)}</span>
        <div style="flex:2;background:var(--overlay);border-radius:2px;height:4px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${col};border-radius:2px"></div>
        </div>
        <span style="color:var(--muted);font-size:0.65rem;min-width:3.5rem;text-align:right">${lbl}</span>
      </div>`;
    }).join('');

    // Monthly contribution chart — all historic months from gh-data.js
    const monthChart = (() => {
      const monthMap = ghd?.calendar_months;
      if (!monthMap) return '';
      const months = Object.keys(monthMap).sort();
      if (!months.length) return '';
      const VW = 250, VH = 56;
      const N = months.length;
      const segW = VW / N;
      const barW = Math.max(segW * 0.72, 1);
      const maxH = 30, bBase = 42, labelY = 53;
      const maxCt = Math.max(...Object.values(monthMap), 1);
      const curMo = new Date().toISOString().slice(0, 7);
      const bars = months.map((mo, i) => {
        const count = monthMap[mo];
        const h   = Math.max(1, (count / maxCt) * maxH);
        const cx  = segW * i + segW / 2;
        const bx  = cx - barW / 2;
        const by  = bBase - h;
        const col = mo === curMo ? 'var(--foam)' : (mo.slice(0, 4) === String(curYear) ? 'var(--iris)' : 'var(--subtle)');
        const isJan = mo.endsWith('-01');
        const label = isJan ? mo.slice(0, 4) : '';
        return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="${col}" rx="1"><title>${mo}: ${count}</title></rect>` +
               (label ? `<text x="${cx.toFixed(1)}" y="${labelY}" fill="var(--muted)" font-size="7" text-anchor="middle">${label}</text>` : '');
      }).join('');
      return `<div style="margin-top:0.5rem">
        <div style="color:var(--muted);font-size:0.68rem;margin-bottom:0.3rem;text-transform:uppercase;letter-spacing:0.08em">contributions by month</div>
        <svg viewBox="0 0 ${VW} ${VH}" style="width:100%;height:52px;display:block">${bars}</svg>
      </div>`;
    })();

    const repoRows = recentRepos.slice(0, 5).map(r => {
      const dot   = r.language ? `<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${LANG_COLORS[r.language] ?? 'var(--muted)'};margin-right:0.28rem;flex-shrink:0"></span>` : '';
      const stars = r.stargazers_count > 0 ? `<span style="color:var(--gold);font-size:0.65rem;flex-shrink:0;margin-left:0.3rem">★${r.stargazers_count}</span>` : '';
      const badge = r.private
        ? `<span style="color:var(--overlay);font-size:0.6rem;border:1px solid var(--overlay);padding:0 0.25rem;border-radius:2px;flex-shrink:0;margin-left:0.3rem">priv</span>`
        : '';
      return `<div style="display:flex;align-items:center;padding:0.18rem 0;border-bottom:1px solid var(--overlay)">
        ${dot}<a href="${esc(r.html_url)}" target="_blank" style="color:var(--iris);font-size:0.72rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</a>${stars}${badge}
      </div>`;
    }).join('');

    const contribRow = (commits7d !== null || contribsYTD !== null) ? `
      <div class="stat-row" style="margin-bottom:0.1rem">
        <span class="stat-label">contributions</span>
        <span style="display:flex;gap:0.6rem;font-size:0.72rem">
          ${commits7d !== null ? `<span><span style="color:var(--muted)">7d</span> <span style="color:var(--foam)">${commits7d}</span></span>` : ''}
          ${contribsYTD !== null ? `<span><span style="color:var(--muted)">ytd</span> <span style="color:var(--iris)">${contribsYTD}</span></span>` : ''}
        </span>
      </div>` : '';

    el.innerHTML = `
      ${contribRow}
      ${monthChart}
      ${topLangs.length ? `
      <div style="margin-top:0.4rem">
        <div style="color:var(--muted);font-size:0.65rem;margin-bottom:0.15rem;text-transform:uppercase;letter-spacing:0.08em">languages</div>
        ${langBar}
      </div>` : ''}
      ${repoList.length ? `
      <div style="margin-top:0.4rem">
        <div style="color:var(--muted);font-size:0.65rem;margin-bottom:0.1rem;text-transform:uppercase;letter-spacing:0.08em">recent</div>
        ${repoRows}
      </div>` : ''}
      <div style="margin-top:0.4rem;display:flex;gap:0.6rem">
        <a href="https://github.com/${username}" target="_blank" style="color:var(--muted);font-size:0.68rem">profile</a>
        <span style="color:var(--overlay)">·</span>
        <a href="https://github.com/${username}?tab=repositories" target="_blank" style="color:var(--muted);font-size:0.68rem">repos</a>
      </div>`;
  } catch (err) {
    el.innerHTML = `<span class="error">github: ${esc(err.message)}</span>`;
  }
}

async function fetchRSS(url, proxy = true) {
  const src  = proxy ? corsProxy(url) : url;
  const text = await fetch(src).then(r => r.text());
  const doc  = new DOMParser().parseFromString(text, 'text/xml');
  if (doc.querySelector('parsererror')) throw new Error('RSS parse failed');
  return Array.from(doc.querySelectorAll('item'));
}

const bizRss2json = url =>

    title:       a.title ?? '',
    url:         a.link  ?? '',
    score:       items.length - i,
    publishedAt: a.pubDate ? new Date(a.pubDate).getTime() : Date.now() - i * 3600000,
    meta:        (a.categories ?? []).slice(0, 2)
                   .map(c => `<span style="color:var(--iris)">${esc(String(c))}</span>`).join(' · '),
  }));
}

const ESPN = 'https://site.api.espn.com/apis/site/v2/sports';

function renderESPNMatch(event, upcoming) {
  const comp        = event.competitions?.[0];
  const competitors = comp?.competitors ?? [];
  const home = competitors.find(c => c.homeAway === 'home');
  const away = competitors.find(c => c.homeAway === 'away');
  const homeTeam = esc(home?.team?.shortDisplayName ?? home?.team?.displayName ?? '?');
  const awayTeam = esc(away?.team?.shortDisplayName ?? away?.team?.displayName ?? '?');
  const score = upcoming
    ? `<span style="color:var(--muted);font-size:0.65rem">vs</span>`
    : `<span class="match-score">${home?.score?.displayValue ?? '?'}-${away?.score?.displayValue ?? '?'}</span>`;
  const date = event.date
    ? new Date(event.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' })
    : '';
  return `<div class="match">
    <div class="match-teams" style="font-size:0.7rem">
      <span class="match-team">${homeTeam}</span>
      ${score}
      <span class="match-team">${awayTeam}</span>
    </div>
    <div class="match-meta" style="font-size:0.65rem">${date}</div>
  </div>`;
}

async function loadSports() {
  const el = document.getElementById('sports-content');
  el.innerHTML = `<span class="loading">fetching...</span>`;

  // Scoreboard date range: today → +60 days
  const pad = n => String(n).padStart(2, '0');
  const fmtDate = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  const today   = new Date();
  const future  = new Date(today.getTime() + 60 * 86400000);
  const dateRange = `${fmtDate(today)}-${fmtDate(future)}`;

  const results = await Promise.allSettled(
    CFG.sports.teams.map(async ({ name, espnId, sport, league, season }) => {
      const scheduleUrl  = `${ESPN}/${sport}/${league}/teams/${espnId}/schedule${season ? `?season=${season}` : ''}`;
      const scoreboardUrl = `${ESPN}/${sport}/${league}/scoreboard?dates=${dateRange}`;
      const [schedData, sbData] = await Promise.all([
        fetch(scheduleUrl).then(r => r.json()),
        fetch(scoreboardUrl).then(r => r.json()),
      ]);

      const past = (schedData.events ?? [])
        .filter(e => e.competitions?.[0]?.status?.type?.completed)
        .sort((a, b) => a.date < b.date ? -1 : 1)
        .slice(-3);

      const upcoming = (sbData.events ?? [])
        .filter(e => e.competitions?.[0]?.competitors?.some(c => c.team?.id === espnId))
        .sort((a, b) => a.date < b.date ? -1 : 1)
        .slice(0, 3);

      return { name, past, upcoming };
    })
  );

  let html = '';
  for (const r of results) {
    if (r.status === 'rejected') { html += `<div class="error">${esc(r.reason?.message ?? 'failed')}</div>`; continue; }
    const { name, past, upcoming } = r.value;
    const pastHtml     = past.map(e => renderESPNMatch(e, false)).join('');
    const upcomingHtml = upcoming.map(e => renderESPNMatch(e, true)).join('');
    html += `<div style="margin-bottom:0.9rem">
      <div style="color:var(--gold);font-size:0.72rem;margin-bottom:0.35rem;text-transform:uppercase;letter-spacing:0.06em">${esc(name)}</div>
      <div style="display:grid;grid-template-columns:1fr 1px 1fr;gap:0.5rem">
        <div style="padding-right:0.25rem">
          <div style="color:var(--muted);font-size:0.65rem;margin-bottom:0.2rem;letter-spacing:0.04em">recent</div>
          ${pastHtml || ''}
        </div>
        <div style="background:var(--overlay)"></div>
        <div style="padding-left:0.25rem">
          <div style="color:var(--muted);font-size:0.65rem;margin-bottom:0.2rem;letter-spacing:0.04em">next</div>
          ${upcomingHtml || ''}
        </div>
      </div>
    </div>`;
  }

  el.innerHTML = html || `<span class="loading">no data</span>`;
}

// ── TRAINING ──────────────────────────────────────────────────────────────────
async function loadStrava() {
  const el = document.getElementById('strava-header');
  const { clientId, clientSecret, refreshToken, goals } = CFG.strava;

  if (!clientId || !clientSecret || !refreshToken) return;

  el.innerHTML = `<span style="color:var(--muted);font-size:0.68rem">syncing…</span>`;
  try {
    const tokenRes = await fetch('https://www.strava.com/oauth/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        client_id: clientId, client_secret: clientSecret,
        refresh_token: refreshToken, grant_type: 'refresh_token',
      }),
    }).then(r => r.json());

    if (!tokenRes.access_token) throw new Error(tokenRes.message ?? 'token exchange failed');

    // Fetch rolling past 52 weeks for sparkline + weekly stats
    const yearStart = Math.floor((Date.now() - 52 * 7 * 86400000) / 1000);
    let page = 1, all = [];
    while (true) {
      const batch = await fetch(
        `https://www.strava.com/api/v3/athlete/activities?after=${yearStart}&per_page=100&page=${page}`,
        { headers: { Authorization: `Bearer ${tokenRes.access_token}` } }
      ).then(r => r.json());
      if (!Array.isArray(batch) || !batch.length) break;
      all = all.concat(batch);
      if (batch.length < 100) break;
      page++;
    }

    // Current week boundary: last Monday 00:00 local
    const now = new Date();
    const weekStart = new Date(now);
    weekStart.setHours(0, 0, 0, 0);
    weekStart.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    const weekStartTs = weekStart.getTime();

    // Absolute week number (ISO-ish, Monday anchor, epoch-based)
    const absWeek  = date => Math.floor(date.getTime() / (7 * 86400000));
    const weekLabel = w => {
      const d = new Date(w * 7 * 86400000);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    };
    const curWeek  = absWeek(now);
    const oldWeek  = curWeek - 51; // 52 bars total

    const weeklyBuckets = {}, thisWeekKm = {}, lastAct = {};
    all.forEach(a => {
      const date = new Date(a.start_date_local ?? a.start_date);
      const wk   = absWeek(date);
      const type = a.type;
      const km   = (a.distance ?? 0) / 1000;
      if (!weeklyBuckets[type]) weeklyBuckets[type] = {};
      weeklyBuckets[type][wk] = (weeklyBuckets[type][wk] ?? 0) + km;
      if (date.getTime() >= weekStartTs)
        thisWeekKm[type] = (thisWeekKm[type] ?? 0) + km;
      if (!lastAct[type]) lastAct[type] = a;
    });

    el.innerHTML = goals.map(g => {
      const type   = g.stravaType;
      const thisWk = (thisWeekKm[type] ?? 0).toFixed(1);
      return `<div class="sh-row"><span class="sh-label">${esc(g.label)}</span><span class="sh-val">${thisWk} km</span></div>`;
    }).join('');
  } catch (err) {
    el.innerHTML = `<span style="color:var(--love);font-size:0.65rem">strava err</span>`;
  }
}

// ── QUOTE ─────────────────────────────────────────────────────────────────────
// Rotation anchored to 2026-03-11 local midnight; advances at local midnight.
// Math.round handles DST edge cases where local midnight isn't exactly divisible.
const QUOTE_EPOCH = Math.round(new Date(2026, 2, 11).getTime() / 86400000);

function localDayNum() {
  const n = new Date();
  return Math.round(new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime() / 86400000);
}

function renderQuote() {
  const idx = ((localDayNum() - QUOTE_EPOCH) % QUOTES.length + QUOTES.length) % QUOTES.length;
  const q   = QUOTES[idx];
  const hq  = document.getElementById('header-quote');
  if (hq) hq.innerHTML =
    `${esc(q.text)} <span class="quote-attr">— ${esc(q.author)}</span>`;
}

// ── WEATHER ───────────────────────────────────────────────────────────────────
// Open-Meteo: free, no auth, CORS-native
const WMO = {
  0:'Clear sky', 1:'Mainly clear', 2:'Partly cloudy', 3:'Overcast',
  45:'Fog', 48:'Icy fog',
  51:'Light drizzle', 53:'Drizzle', 55:'Heavy drizzle',
  61:'Light rain', 63:'Rain', 65:'Heavy rain',
  71:'Light snow', 73:'Snow', 75:'Heavy snow',
  80:'Rain showers', 81:'Showers', 82:'Heavy showers',
  95:'Thunderstorm', 96:'Thunderstorm + hail', 99:'Heavy thunderstorm + hail',
};

async function loadWeather() {
  const el = document.getElementById('weather-header');
  // Start with Monterrey fallback; override from ipinfo if reachable
  let lat = 25.6866, lon = -100.3161, city = 'Monterrey';
  try {
    const info = await fetch('https://ipinfo.io/json').then(r => r.json());
    if (info.loc) [lat, lon] = info.loc.split(',').map(Number);
    if (info.city) city = info.city;
  } catch (_) { /* use Monterrey defaults */ }
  try {
    const weather = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&current=temperature_2m,weather_code&timezone=auto`
    ).then(r => r.json());
    const c = weather.current;
    el.innerHTML =
      `<span class="wh-temp">${c.temperature_2m}°C</span>` +
      `<span class="wh-cond">${WMO[c.weather_code] ?? ''}${city ? ` · ${esc(city)}` : ''}</span>`;
  } catch (_) { el.textContent = ''; }
}


// ── MARKETS ───────────────────────────────────────────────────────────────────
const TV_SYMBOLS = [
  { label: 'USDMXN', tv: 'FX:USDMXN',  av: { fn: 'forex', from: 'USD', to: 'MXN' } },
  { label: 'SPX',    tv: 'TVC:SPX',     av: { fn: 'quote', sym: 'SPX'  } },
  { label: 'VOOG',   tv: 'AMEX:VOOG',   av: { fn: 'quote', sym: 'VOOG' } },
  { label: 'DJI',    tv: 'TVC:DJI',     av: { fn: 'quote', sym: 'DJI'  } },
  { label: 'VIX',    tv: 'TVC:VIX',     av: { fn: 'quote', sym: 'VIX'  } },
  { label: 'DXY',    tv: 'TVC:DXY',     av: { fn: 'quote', sym: 'DXY'  } },
  { label: 'NU',     tv: 'NYSE:NU',      av: { fn: 'quote', sym: 'NU'   } },
];

function fmtPrice(p) {
  if (p == null) return '';
  return p >= 1000 ? p.toLocaleString('en', { maximumFractionDigits: 0 }) : p.toFixed(2);
}

async function loadMarkets() {
  const el  = document.getElementById('ticker-bar');
  const key = window.AV_KEY;
  const AV  = 'https://www.alphavantage.co/query';

  if (!key) {
    el.innerHTML = `<span style="color:var(--muted);font-size:0.72rem">markets: set AV_KEY in config.js</span>`;
    return;
  }

  const fetches = TV_SYMBOLS.map(s => {
    const url = s.av.fn === 'forex'
      ? `${AV}?function=CURRENCY_EXCHANGE_RATE&from_currency=${s.av.from}&to_currency=${s.av.to}&apikey=${key}`
      : `${AV}?function=GLOBAL_QUOTE&symbol=${encodeURIComponent(s.av.sym)}&apikey=${key}`;
    return fetch(url).then(r => r.json()).catch(() => null);
  });

  const results = await Promise.all(fetches);
  const quotes  = {};

  TV_SYMBOLS.forEach((s, i) => {
    const data = results[i];
    if (!data) return;

    if (s.av.fn === 'forex') {
      const rate = data['Realtime Currency Exchange Rate'];
      if (!rate) return;
      const px      = parseFloat(rate['5. Exchange Rate']);
      const prevKey = `mkt_prev_${s.label}`;
      const prev    = parseFloat(localStorage.getItem(prevKey) || '0');
      const pct     = prev > 0 ? ((px - prev) / prev) * 100 : null;
      localStorage.setItem(prevKey, String(px));
      quotes[s.label] = { px, pct };
    } else {
      const gq = data['Global Quote'];
      if (!gq?.['05. price']) return;
      const px  = parseFloat(gq['05. price']);
      const pct = parseFloat((gq['10. change percent'] ?? '').replace('%', ''));
      quotes[s.label] = { px, pct: isNaN(pct) ? null : pct };
    }
  });

  el.innerHTML = TV_SYMBOLS.map(s => {
    const q   = quotes[s.label];
    const pct = q?.pct ?? null;
    const px  = q?.px  ?? null;
    const up  = pct != null && pct >= 0;
    const tri = pct == null ? '' : up ? '▲' : '▼';
    const cls = pct == null ? '' : up ? 't-up' : 't-dn';
    return `<a href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(s.tv)}" target="_blank" class="ticker-item">` +
      `<span class="t-label">${s.label}</span>` +
      (px  != null ? ` <span class="t-price">${fmtPrice(px)}</span>` : '') +
      (pct != null ? ` <span class="${cls}">${tri} ${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%</span>` : '') +
      `</a>`;
  }).join('');
}
