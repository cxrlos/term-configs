# tmux owns projects: one persistent session per project (windows editor, agent, shell + extras),
# plus scrollback search and copying. No plugins. Keys carry notes: `prefix ?` lists them.

set -g prefix '`'
unbind C-b
bind -N "Type a literal backtick" '`' send-prefix

set -g default-terminal tmux-256color
set -as terminal-features ',alacritty:RGB,xterm-256color:RGB'
set -g escape-time 10
set -g focus-events on
set -g extended-keys on
set -g allow-passthrough on
set -g set-clipboard on            # y in copy mode reaches the system clipboard via OSC 52
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off       # closing a session switches to another instead of exiting
setw -g mode-keys vi

# Projects
bind -N "Projects: pick or create a session" f display-popup -E -w 70% -h 60% "$HOME/.local/bin/tmux-sessionizer"
bind -N "Previous session" Tab switch-client -l
bind -N "Kill this session" X confirm-before -p "kill session #S? (y/n)" kill-session

# Windows and panes
bind -N "New window (here)" c new-window -c "#{pane_current_path}"
bind -N "Split right" v split-window -h -c "#{pane_current_path}"
bind -N "Split below" s split-window -v -c "#{pane_current_path}"
bind -N "Pane left" -r h select-pane -L
bind -N "Pane down" -r j select-pane -D
bind -N "Pane up" -r k select-pane -U
bind -N "Pane right" -r l select-pane -R
bind -N "Grow left" -r H resize-pane -L 3
bind -N "Grow down" -r J resize-pane -D 2
bind -N "Grow up" -r K resize-pane -U 2
bind -N "Grow right" -r L resize-pane -R 3
bind -N "Close pane" x kill-pane
bind -N "Reload config" r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Ctrl+h/j/k/l crosses tmux panes and nvim splits alike (nvim needs vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -N "Focus left (tmux or nvim)" -n C-h if "$is_vim" 'send C-h' 'select-pane -L'
bind -N "Focus down (tmux or nvim)" -n C-j if "$is_vim" 'send C-j' 'select-pane -D'
bind -N "Focus up (tmux or nvim)" -n C-k if "$is_vim" 'send C-k' 'select-pane -U'
bind -N "Focus right (tmux or nvim)" -n C-l if "$is_vim" 'send C-l' 'select-pane -R'
bind -N "Clear the screen" C-l send-keys C-l

# Copy mode: deliberate, keyboard only. Nothing copies until y.
bind -N "Copy mode (scrollback: / search, v select, y copy)" Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane   # a mouse drag selects; it doesn't copy

# Look: one line, gruvbox
set -g status-style 'bg=default,fg=#a89984'
set -g status-left '#[fg=#8ec07c,bold] #S  '
set -g status-left-length 30
set -g status-right '#{?window_zoomed_flag,#[fg=#fabd2f]zoom ,}'
setw -g window-status-format ' #I #W '
setw -g window-status-current-format '#[fg=#8ec07c,bold] #I #W '
set -g pane-border-style fg=#3c3836
set -g pane-active-border-style fg=#8ec07c
set -g message-style 'fg=#ebdbb2,bg=#504945'
set -g mode-style 'fg=#282828,bg=#8ec07c'
