# tmux owns projects: one persistent session per project (windows editor, agent, shell + extras),
# plus scrollback search and copying. No plugins. Keys carry notes: `prefix ?` lists them.

set -g prefix '`'
unbind C-b
bind -N "Type a literal backtick" '`' send-prefix

set -g default-terminal tmux-256color
set -as terminal-features ',alacritty:RGB,xterm-ghostty:RGB,xterm-256color:RGB'
set -g escape-time 10
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features '*:extkeys'   # Shift+Enter etc. reach agent TUIs
set -as terminal-features '*:hyperlinks' # OSC 8 links (delta, ls --hyperlink) pass through
set -g set-clipboard on            # y in copy mode reaches the system clipboard via OSC 52
set -g get-clipboard off           # panes can't read the clipboard back
set -ga update-environment ' WAYLAND_DISPLAY SWAYSOCK'
setw -g monitor-bell on            # an agent waiting for you rings the bell: flagged in the status
set -g bell-action other
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off       # closing a session switches to another instead of exiting
setw -g mode-keys vi

# Projects
bind -N "Projects: pick or create a session" f display-popup -E -w 70% -h 60% "$HOME/.local/bin/tmux-sessionizer"
bind -N "Previous session" Tab switch-client -l
bind -N "Kill this session" X confirm-before -p "kill session #S? (y/n)" kill-session

# Windows and panes
bind -N "New window (here)" c new-window -c "#{pane_current_path}"
bind -N "Split right" v split-window -h -c "#{pane_current_path}"
bind -N "Split below" - split-window -v -c "#{pane_current_path}"
bind -N "Grow left" -r H resize-pane -L 3
bind -N "Grow down" -r J resize-pane -D 2
bind -N "Grow up" -r K resize-pane -U 2
bind -N "Grow right" -r L resize-pane -R 3
bind -N "Close pane" x kill-pane
bind -N "Reload config" r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Ctrl+h/j/k/l crosses tmux panes and nvim splits alike (nvim needs vim-tmux-navigator).
# In a window named `agent` the keys go to the agent TUI (Ctrl+J newline, Ctrl+K kill line...).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -N "Focus left (tmux or nvim; agent window keeps it)" -n C-h if -F '#{==:#{window_name},agent}' 'send C-h' { if "$is_vim" 'send C-h' 'select-pane -L' }
bind -N "Focus down (tmux or nvim; agent window keeps it)" -n C-j if -F '#{==:#{window_name},agent}' 'send C-j' { if "$is_vim" 'send C-j' 'select-pane -D' }
bind -N "Focus up (tmux or nvim; agent window keeps it)" -n C-k if -F '#{==:#{window_name},agent}' 'send C-k' { if "$is_vim" 'send C-k' 'select-pane -U' }
bind -N "Focus right (tmux or nvim; agent window keeps it)" -n C-l if -F '#{==:#{window_name},agent}' 'send C-l' { if "$is_vim" 'send C-l' 'select-pane -R' }
bind -N "Clear the screen" C-l send-keys C-l

# Copy mode: deliberate, keyboard only. Nothing copies until y.
bind -N "Copy mode (scrollback: / search, v select, y copy)" Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane   # a mouse drag selects; it doesn't copy
set -g copy-mode-line-numbers hybrid        # like nvim's relativenumber: 5k, 12j
set -g copy-mode-line-number-style fg=#3b4261
set -g copy-mode-current-line-number-style fg=#e0af68

# Look: one line, Tokyo Night
set -g status-style 'bg=default,fg=#565f89'
set -g status-left '#[fg=#7aa2f7,bold] #S  '
set -g status-left-length 30
set -g status-right '#{?window_zoomed_flag,#[fg=#e0af68]zoom ,}'
setw -g window-status-format '#{?window_bell_flag,#[fg=#e0af68],} #I #W '
setw -g window-status-current-format '#[fg=#7aa2f7,bold] #I #W '
set -g pane-border-style fg=#292e42
set -g pane-active-border-style fg=#7aa2f7
set -g message-style 'fg=#c0caf5,bg=#292e42'
set -g mode-style 'fg=#c0caf5,bg=#283457'
