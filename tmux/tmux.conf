# ── Prefix ────────────────────────────────────────────────────────────────────
set -g prefix `
unbind C-b
bind ` send-prefix

# ── Terminal ──────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g escape-time 0
set -g focus-events on
set -g repeat-time 800

# ── General ───────────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 50000
setw -g mode-keys vi

# ── Pane styling ─────────────────────────────────────────────────────────────
set -g window-style "bg=#171523"
set -g window-active-style "bg=#191724"
set -g pane-border-style "fg=#393552"
set -g pane-active-border-style "fg=#9ccfd8"
set -g pane-border-lines heavy
set -g pane-border-indicators colour
setw -g pane-border-status top
setw -g pane-border-format "\
#{?pane_active,\
#[fg=#191724,bg=#9ccfd8,bold] #{pane_current_command} #[fg=#9ccfd8,bg=#1f1d2e]▸#[default] #[fg=#6e6a86]#{=30:pane_current_path},\
#[fg=#6e6a86] #{pane_current_command}  #{=20:pane_current_path}\
} "

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1f1d2e,fg=#908caa"
set -g status 2
set -g status-format[1] "#[bg=#191724] "

set -g status-left "#[fg=#191724,bg=#c4a7e7,bold]  #S #[fg=#c4a7e7,bg=#1f1d2e] "
set -g status-left-length 30

set -g status-right "\
#{?window_zoomed_flag,#[fg=#f6c177]  ,}\
#[fg=#c4a7e7] #(cd #{pane_current_path} && git branch --show-current 2>/dev/null) \
#[fg=#393552]│ \
#[fg=#908caa]󰥔 %H:%M "
set -g status-right-length 80

setw -g window-status-format "  #[fg=#6e6a86]#I #W "
setw -g window-status-current-format "  #[fg=#e0def4,bg=#26233a,bold]#I #W "
setw -g window-status-separator "#[fg=#393552]│"

# ── Messages, menus & copy mode ──────────────────────────────────────────────
set -g message-style "fg=#e0def4,bg=#26233a"
set -g mode-style "fg=#191724,bg=#c4a7e7"
set -g display-time 2000

# ── Popup styling ────────────────────────────────────────────────────────────
set -g popup-border-style "fg=#9ccfd8"
set -g popup-border-lines rounded

# ── Seamless vim-tmux navigation ─────────────────────────────────────────────
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# ── Windows ───────────────────────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"

bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

bind n next-window
bind p previous-window
bind ^ last-window
bind z resize-pane -Z

# ── Panes ─────────────────────────────────────────────────────────────────────
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-Left  resize-pane -L 3
bind -n M-Down  resize-pane -D 2
bind -n M-Up    resize-pane -U 2
bind -n M-Right resize-pane -R 3

bind x kill-pane
bind X kill-window

# ── Copy mode (vi) ────────────────────────────────────────────────────────────
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ── Floating popups ──────────────────────────────────────────────────────────
bind / display-popup -E -w 60 -h 30 -T " tmux keys " "$HOME/.tmux-cheatsheet.sh"
bind g display-popup -E -w 90% -h 90% "lazygit"
bind t display-popup -E -w 80% -h 80% "htop"
bind f display-popup -E -w 60 -h 20 -T " projects " "$HOME/.local/bin/tmux-sessionizer"

# ── Plugins (TPM) ────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'Morantron/tmux-fingers'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @thumbs-key Space
set -g @fingers-key Tab
set -g @tmux-fzf-launch-key 'w'

# ── Reload ────────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
