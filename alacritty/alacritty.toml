[general]
import = ["~/.config/alacritty/gruvbox.toml"]

[window]
padding = { x = 6, y = 6 }
dynamic_padding = true
opacity = 0.92
decorations_theme_variant = "Dark"
option_as_alt = "Both" # macOS: Option acts as Alt

[font]
normal = { family = "JetBrainsMono Nerd Font Mono" }
size = 10.0

[keyboard]
bindings = [{ key = "Return", mods = "Shift", chars = "\u001B\r" }] # newline in Claude Code
